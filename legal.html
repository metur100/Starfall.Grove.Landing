<!doctype html>
<!-- The shell of the legal and help pages. vite.config.ts serves it at every route in src/legal/routes.ts, in every
     language, filling in %page.*%, and the page itself is drawn by src/legal/main.tsx. -->
<html lang="%page.lang%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1520" />
    <title>%page.title% · Starfall Grove</title>
    <meta name="description" content="%page.description%" />
    <meta name="author" content="%site.developer%" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%page.url%" />
%page.alternates%
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Starfall Grove" />
    <meta property="og:title" content="%page.title% · Starfall Grove" />
    <meta property="og:description" content="%page.description%" />
    <meta property="og:url" content="%page.url%" />
    <meta property="og:locale" content="%page.ogLocale%" />
%page.ogAlternates%
    <meta property="og:image" content="%page.ogImage%" />
    <meta property="og:image:width" content="%page.ogImageW%" />
    <meta property="og:image:height" content="%page.ogImageH%" />
    <meta property="og:image:type" content="%page.ogImageType%" />
    <meta property="og:image:alt" content="%page.imageAlt%" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%page.title% · Starfall Grove" />
    <meta name="twitter:description" content="%page.description%" />
    <meta name="twitter:image" content="%page.ogImage%" />
    <link rel="icon" type="image/png" sizes="192x192" href="%page.base%icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%page.base%apple-touch-icon.png" />
    <link rel="manifest" href="%page.base%site.webmanifest" />
    %page.ld%
  </head>
  <body class="legal-page" data-page="%page.slug%">
    <div id="root">
      <noscript><p style="padding:120px 24px;text-align:center">%page.noscript% <a href="mailto:%site.email%">%site.email%</a>.</p></noscript>
    </div>
    <script type="module" src="/src/legal/main.tsx"></script>
  </body>
</html>
