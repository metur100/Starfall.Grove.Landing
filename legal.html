<!doctype html>
<!-- The shell of the legal and help pages. vite.config.ts serves it at every route in src/legal/routes.ts, filling in
     %page.*%, and the page itself is drawn by src/legal/main.tsx. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1520" />
    <title>%page.title% · Starfall Grove</title>
    <meta name="description" content="%page.description%" />
    <link rel="canonical" href="%site.siteUrl%%page.slug%/" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
  </head>
  <body class="legal-page" data-page="%page.slug%">
    <div id="root">
      <noscript><p style="padding:120px 24px;text-align:center">This page needs JavaScript. You can reach us at <a href="mailto:%site.email%">%site.email%</a>.</p></noscript>
    </div>
    <script type="module" src="/src/legal/main.tsx"></script>
  </body>
</html>
